name: Docker images

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "lib/**"
      - "native/**"
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/docker-image.yml"
  pull_request:
    paths:
      - "examples/**"
      - "lib/**"
      - "native/**"
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:
    inputs:
      example:
        description: Build only this example (leave empty to build all)
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        example:
          - brotli_compress
          - latency_compare
          - live_svelte_wasm
          - live_vue_wasm
          - matrix_mul
          - private_analytics

    steps:
      - name: Checkout
        if: inputs.example == '' || inputs.example == matrix.example
        uses: actions/checkout@v5

      # ghcr rejects uppercase, and the image name reads better with dashes.
      - name: Resolve image name
        if: inputs.example == '' || inputs.example == matrix.example
        id: image
        env:
          EXAMPLE: ${{ matrix.example }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=${REGISTRY}/${owner}/exclosured-${EXAMPLE//_/-}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: inputs.example == '' || inputs.example == matrix.example
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: >-
          github.event_name != 'pull_request' &&
          (inputs.example == '' || inputs.example == matrix.example)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: inputs.example == '' || inputs.example == matrix.example
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # The build context is the repository root: each example depends on the
      # library through {:exclosured, path: "../.."}.
      - name: Build and push
        if: inputs.example == '' || inputs.example == matrix.example
        uses: docker/build-push-action@v7
        with:
          context: .
          file: examples/Dockerfile
          build-args: EXAMPLE=${{ matrix.example }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.example }}
          cache-to: type=gha,mode=max,scope=${{ matrix.example }}
